<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layout Lab — Projet Bambi</title>
<style>
  :root{
    --bg:#0f1318; --panel:#171d25; --line:#2b3540; --ink:#e8eaed; --ink-dim:#93a0ad;
    --ok:#4ea87a; --bad:#d4564a;
    --z-board:#4a7ba8; --z-dash:#2f7d6f; --z-info:#b07d2a;
    --z-illu:#7a5a9e; --z-dice:#a8543f; --z-round:#6a7a55; --z-rd:#3f6f96;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;font-size:14px;overscroll-behavior:none}
  body{display:flex;flex-direction:column}

  /* ---------- barre de contrôle ---------- */
  #controls{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;
    display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;flex:0 0 auto}
  .grp{display:flex;flex-direction:column;gap:5px}
  .grp>span{font-size:11px;color:var(--ink-dim)}
  label.mod{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-dim);cursor:pointer}
  label.mod input{accent-color:#6ea8d8}
  label.mod.on{color:var(--ink)}
  .row{display:flex;gap:6px;align-items:center}
  button,select{background:#222b35;color:var(--ink);border:1px solid var(--line);
    border-radius:5px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  button:hover,select:hover{background:#2c3742}
  button.on{background:#3d5a72;border-color:#5b7f9e}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #6ea8d8;outline-offset:1px}
  input[type=number]{width:72px;background:#222b35;color:var(--ink);border:1px solid var(--line);
    border-radius:5px;padding:6px;font:inherit}
  input[type=range]{width:150px;accent-color:#6ea8d8}

  /* ---------- scène ---------- */
  #stage{flex:1 1 auto;min-height:0;position:relative;overflow:auto;padding:14px;
    background:repeating-linear-gradient(45deg,#0f1318,#0f1318 10px,#121720 10px,#121720 20px)}
  #frame{position:relative;background:#05070a;border:1px solid #3a4652;
    transform-origin:top left;box-shadow:0 6px 30px rgba(0,0,0,.6)}
  body.real #controls{display:none}
  body.real #stage{padding:0;overflow:hidden;background:#05070a}
  body.real #frame{border:none;box-shadow:none}

  .zone{position:absolute;border-radius:5px;border:1.5px solid;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:4px;text-align:center;line-height:1.3}
  .zone b{font-size:13px;font-weight:600;letter-spacing:.2px}
  .zone small{font-size:11px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
  .zone.tight{justify-content:flex-start}
  .zone.tight b{font-size:11px}
  .zone.tight small{font-size:10px}
  .zone.tight .badge{display:none}
  .zone.bad{border-color:var(--bad) !important;border-width:2px;
    box-shadow:inset 0 0 0 9999px rgba(212,86,74,.12)}
  .zone.over{border-style:dashed;opacity:.92}
  .badge{position:absolute;top:3px;right:5px;font-size:10px;color:rgba(255,255,255,.6)}

  .z-board{background:rgba(74,123,168,.28);border-color:var(--z-board)}
  .z-dash {background:rgba(47,125,111,.28);border-color:var(--z-dash)}
  .z-info {background:rgba(176,125,42,.28);border-color:var(--z-info)}
  .z-illu {background:rgba(122,90,158,.30);border-color:var(--z-illu)}
  .z-dice {background:rgba(168,84,63,.30);border-color:var(--z-dice)}
  .z-round{background:rgba(106,122,85,.34);border-color:var(--z-round)}
  .z-rd   {background:rgba(63,111,150,.34);border-color:var(--z-rd)}

  /* ---------- rapport ---------- */
  #report{flex:0 0 auto;max-height:34vh;overflow:auto;background:var(--panel);
    border-top:1px solid var(--line);padding:10px 12px}
  body.real #report{display:none}
  table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:4px 8px;border-bottom:1px solid #222b35}
  th{color:var(--ink-dim);font-weight:500;font-size:11px}
  td.v-ok{color:var(--ok)} td.v-bad{color:var(--bad)}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
  #verdict{margin:0 0 8px;font-size:13px}
  #verdict .tag{border-radius:4px;padding:2px 7px;margin-right:8px;font-size:12px}
  .tag.ok{background:rgba(78,168,122,.2);color:var(--ok)}
  .tag.bad{background:rgba(212,86,74,.2);color:var(--bad)}
  #steps{color:var(--ink-dim);font-size:12px;margin:6px 0 0}
  #exit{position:fixed;top:8px;right:8px;z-index:50;display:none}
  body.real #exit{display:block}
</style>
</head>
<body>

<div id="controls">
  <div class="grp"><span>Appareil simulé</span>
    <div class="row" id="presets"></div>
  </div>
  <div class="grp"><span>Largeur</span>
    <div class="row">
      <input type="number" id="wNum" min="280" max="2560" step="1">
      <input type="range" id="wRng" min="280" max="2560" step="1">
    </div>
  </div>
  <div class="grp"><span>Hauteur</span>
    <div class="row">
      <input type="number" id="hNum" min="280" max="1600" step="1">
      <input type="range" id="hRng" min="280" max="1600" step="1">
    </div>
  </div>
  <div class="grp"><span>Joueurs</span>
    <select id="players"><option>2</option><option>3</option><option selected>4</option></select>
  </div>
  <div class="grp"><span>Profil</span>
    <select id="profile">
      <option value="auto">automatique</option>
      <option value="portrait">portrait</option>
      <option value="landscape">paysage compact</option>
      <option value="wide">écran large</option>
    </select>
  </div>
  <div class="grp"><span>Modules présents</span>
    <div class="row" id="modules"></div>
  </div>
  <div class="grp"><span>Écran réel</span>
    <div class="row">
      <button id="realBtn">Utiliser mon écran</button>
      <button id="fsBtn">Plein écran</button>
    </div>
  </div>
</div>

<div id="stage"><div id="frame"></div></div>
<button id="exit">Revenir aux réglages</button>

<div id="report">
  <p id="verdict"></p>
  <table>
    <thead><tr><th>Module</th><th>Taille obtenue</th><th>Minimum</th><th>Marge</th><th>Lecture</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="steps"></p>
</div>

<script src="../layout-engine.js"></script>
<script>
"use strict";

/* =====================================================================
   1 + 2. CONTRAT D'AFFICHAGE ET MOTEUR : ../layout-engine.js
   Le bac à sable n'a PAS sa propre copie du calcul — il charge le
   module de production. Ce qu'on juge ici est donc exactement ce que
   le jeu appliquera, et une correction faite au moteur se voit
   immédiatement dans le bac à sable sans risque de divergence.
   ===================================================================== */

/* =====================================================================
   3. RENDU — rectangles + rapport chiffré.
   ===================================================================== */
const LABEL = {
  board:["Plateau","z-board"], info:["Info contextuelle","z-info"], illu:["Illustration","z-illu"],
  dice:["Dicetrack","z-dice"], round:["Round","z-round"], dash:["Dashboard","z-dash"],
  roaddie:["Road die","z-rd"]
};
const frame = document.getElementById("frame");

function draw(L, W, H){
  frame.style.width = W+"px"; frame.style.height = H+"px";
  frame.textContent = "";
  const rowsEl = document.getElementById("rows"); rowsEl.textContent = "";
  let allOk = true;

  Object.values(L.zones).forEach(zn => {
    if (!zn || !zn.id) return;
    const base = zn.id.replace(/\d+$/,"");
    const [name, cls] = LABEL[base];
    const ok = zn.w >= zn.minW - 0.5 && zn.h >= zn.minH - 0.5;
    if (!ok) allOk = false;

    const el = document.createElement("div");
    el.className = "zone " + cls + (ok ? "" : " bad") + (zn.overlay ? " over" : "")
                 + (zn.h < 64 ? " tight" : "");
    el.style.cssText = `left:${zn.x}px;top:${zn.y}px;width:${zn.w}px;height:${zn.h}px`;
    const idx = zn.id.match(/\d+$/);
    const title = base === "dash" ? `${name} ${Number(idx[0])+1}` : name;
    el.innerHTML = `<b>${title}</b><small>${zn.w} × ${zn.h}</small>`;
    if (zn.overlay) el.insertAdjacentHTML("beforeend", '<span class="badge">surimpression</span>');
    if (base === "board") el.insertAdjacentHTML("beforeend",
      `<small>case ${L.cell.toFixed(0)} px · ${L.tiles.toFixed(1)} tuile(s) visible(s)</small>`);
    frame.appendChild(el);

    if (base === "dash" && idx[0] !== "0") return;
    const tr = document.createElement("tr");
    const mw = zn.w - zn.minW, mh = zn.h - zn.minH;
    const label = base === "dash" ? `${name}s (${L.visible} sur ${L.players} visibles)` : title;
    tr.innerHTML = `<td><span class="swatch" style="background:var(--${cls.replace('z-','z-')})"></span>${label}
        ${zn.overlay ? '<small> — surimpression</small>' : ''}</td>
      <td>${zn.w} × ${zn.h}</td>
      <td>${Math.round(zn.minW)} × ${Math.round(zn.minH)}</td>
      <td class="${ok?'v-ok':'v-bad'}">${mw>=0?'+':''}${Math.round(mw)} / ${mh>=0?'+':''}${Math.round(mh)}</td>
      <td>${base==="board" ? `case de ${L.cell.toFixed(0)} px`
          : base==="info" ? `${Math.floor(zn.w/8.8)} car. par ligne`
          : base==="illu" ? `véhicule ${Math.round((zn.w-28)/2)} px de large`
          : base==="dice" ? `dé ${Math.round(Math.min((zn.w-28)/2, zn.h-16))} px`
          : base==="roaddie" ? `face de ${Math.round(zn.w-12)} px`
          : base==="dash" ? `${(zn.w/871*100).toFixed(0)} % de l'échelle native` : "—"}</td>`;
    rowsEl.appendChild(tr);
  });

  document.getElementById("verdict").innerHTML =
    `<span class="tag ${allOk?'ok':'bad'}">${allOk?'Contrat respecté':'Contrat non respecté'}</span>`
    + `Profil <strong>${L.profile}</strong> — ${W} × ${H} px, rapport ${L.ratio.toFixed(2)}`;
  document.getElementById("steps").textContent =
    L.steps.length ? "Dégradations appliquées : " + L.steps.join(" · ") : "Aucune dégradation nécessaire.";
  return allOk;
}

/* =====================================================================
   4. PILOTAGE
   ===================================================================== */
const PRESETS = [
  ["Pixel portrait",412,915], ["Pixel paysage",915,412],
  ["iPhone SE",375,667], ["Tablette",820,1180],
  ["Ordinateur",1512,850], ["Grand écran",1920,1080]
];
const wNum=document.getElementById("wNum"), wRng=document.getElementById("wRng"),
      hNum=document.getElementById("hNum"), hRng=document.getElementById("hRng"),
      stage=document.getElementById("stage");
let real = false;

// Les 4 modules optionnels : décochés = absents du DOM, donc non placés.
// « Jeu d'aujourd'hui » = round seul, l'état réel avant l'intégration.
const MODULES = [["illu","Illustration"],["dice","Dicetrack"],["roaddie","Road die"],["round","Round"]];
const modBoxes = {};
MODULES.forEach(([id,nom])=>{
  const l=document.createElement("label"); l.className="mod on";
  const c=document.createElement("input"); c.type="checkbox"; c.checked=true;
  c.onchange=()=>{ l.classList.toggle("on", c.checked); render(); };
  l.appendChild(c); l.appendChild(document.createTextNode(nom));
  document.getElementById("modules").appendChild(l); modBoxes[id]=c;
});
function presentModules(){ const p={}; MODULES.forEach(([id])=>p[id]=modBoxes[id].checked); return p; }

PRESETS.forEach(([n,w,h])=>{
  const b=document.createElement("button"); b.textContent=n;
  b.onclick=()=>{ real=false; document.body.classList.remove("real"); setSize(w,h); };
  document.getElementById("presets").appendChild(b);
});

function setSize(w,h){ wNum.value=wRng.value=w; hNum.value=hRng.value=h; render(); }
[wNum,wRng].forEach(el=>el.oninput=()=>{ wNum.value=wRng.value=el.value; render(); });
[hNum,hRng].forEach(el=>el.oninput=()=>{ hNum.value=hRng.value=el.value; render(); });
document.getElementById("players").onchange = render;
document.getElementById("profile").onchange = render;

/* Mesure de l'espace réellement utilisable : visualViewport d'abord,
   innerWidth/Height en repli. Les insets système sont lus via env(). */
const probe = document.createElement("div");
probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;"
  + "padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);"
  + "padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)";
document.body.appendChild(probe);
function usableSpace(){
  const vv = window.visualViewport;
  const w = Math.round(vv ? vv.width : window.innerWidth);
  const h = Math.round(vv ? vv.height : window.innerHeight);
  const cs = getComputedStyle(probe);
  const px = s => parseFloat(s) || 0;
  return { w: w - px(cs.paddingLeft) - px(cs.paddingRight),
           h: h - px(cs.paddingTop) - px(cs.paddingBottom) };
}

document.getElementById("realBtn").onclick = ()=>{ real=true; document.body.classList.add("real"); render(); };
document.getElementById("exit").onclick = ()=>{
  real=false; document.body.classList.remove("real");
  if (document.fullscreenElement) document.exitFullscreen(); render();
};
document.getElementById("fsBtn").onclick = async ()=>{
  try{
    if (!document.fullscreenElement) { await document.documentElement.requestFullscreen({navigationUI:"hide"}); }
    else await document.exitFullscreen();
  }catch(e){ alert("Plein écran refusé par le navigateur : " + e.message); }
  real=true; document.body.classList.add("real"); render();
};

function render(){
  let W, H;
  if (real) { const u = usableSpace(); W = u.w; H = u.h; }
  else { W = +wNum.value; H = +hNum.value; }
  const L = computeLayout(W, H, +document.getElementById("players").value,
                          document.getElementById("profile").value, presentModules());
  draw(L, W, H);
  if (real) { frame.style.transform = "none"; }
  else {
    const availW = stage.clientWidth - 28, availH = stage.clientHeight - 28;
    const k = Math.min(1, availW/W, availH/H);
    frame.style.transform = k < 1 ? `scale(${k})` : "none";
  }
}

/* Un seul point d'écoute, toutes les sources de changement de taille. */
const schedule = (()=>{ let id=0; return ()=>{ cancelAnimationFrame(id); id=requestAnimationFrame(render); }; })();
new ResizeObserver(schedule).observe(document.body);
if (window.visualViewport) window.visualViewport.addEventListener("resize", schedule);
window.addEventListener("orientationchange", schedule);
document.addEventListener("fullscreenchange", schedule);

setSize(412, 915);
</script>
</body>
</html>
