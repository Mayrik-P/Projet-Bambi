<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Thunder Road Vendetta — Prototype jouable (humain vs IA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: -apple-system, sans-serif; background: #1e1e24; color: #eee; margin: 0; padding: 0; }
  #wrap { max-width: 1000px; margin: 0 auto; }
  .die { display: inline-block; background: #3a3a46; border-radius: 4px; padding: 2px 7px; margin-right: 3px; font-weight: bold; }
  svg { display: block; width: 100%; height: auto; background: #26262e; }
  .clickable { cursor: pointer; }
  .clickable:hover { filter: brightness(1.3); }
  /* Retirés de l'affichage (retour de Mayrik) — gardés dans le DOM
     (juste masqués) car ui-script.js continue d'y écrire du contenu ;
     les enlever du DOM casserait ces appels. */
  h1, .sub, .badges, #panel, .damageList, .legend { display: none; }
  #choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button.choice { background: #3a3a46; border: 1px solid #555; color: #eee; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.choice:hover { background: #4a4a58; }
  button.choice.selected { background: #ffb347; color: #1e1e24; font-weight: bold; }
  button.primary { background: #ffb347; border: none; color: #1e1e24; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin: 0; }
  button.primary:disabled { opacity: 0.3; cursor: default; }
  button.secondary { background: #555; border: none; color: #eee; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; margin-left: 8px; }
  #log { margin: 12px; padding: 12px; background: #2c2c36; border-radius: 8px; font-size: 13px; line-height: 1.6; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
  #log div.line { margin-bottom: 2px; }
  #log div.turn-sep { color: #ffb347; font-weight: bold; margin: 6px 0 2px 0; }
  #winnerBanner { display: none; }
  #panel .stop-message { background: #4a2020; border: 1px solid #a04040; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
  #panel .tile-message { background: #204a3a; border: 1px solid #3ba07a; padding: 10px; border-radius: 6px; margin-bottom: 8px; }

  /* --------------------------------------------------------------
     Écran d'accueil (retour de Mayrik) : choix du nombre d'IA avant
     le début de la partie. Ambiance graphique reprise de TRV Road
     Tile Editor (même jeu, même univers) — fond parchemin, overlay
     sombre, typographie extrudée "Alfa Slab One"/Oswald, boutons dorés
     à bordure. Prototype pour l'instant (1/2/3 IA seulement) — un
     futur menu complet (2e joueur humain, options) viendra remplacer
     ceci sans toucher au reste de l'appli, même esprit que #title-band
     dans le projet de référence. Visible par défaut ; masqué une fois
     un choix fait (voir hideStartScreen() dans ui-script.js). -->
  #start-screen { position: fixed; inset: 0; background: #565558; display: flex;
    align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  #start-screen-inner { display: flex; flex-direction: column; align-items: center; max-width: 460px; width: 100%; }
  #start-title { font-family: "Alfa Slab One", serif; font-size: clamp(24px, 6vw, 34px);
    color: #ecd5a7; text-transform: uppercase; letter-spacing: 1px; text-align: center;
    -webkit-text-stroke: 1.2px #000; text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,0.6);
    margin: 0 0 4px; }
  #start-subtitle { font-family: "Oswald", Arial, sans-serif; font-weight: 700; font-size: 12px;
    color: #d9a34a; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 30px; text-align: center; }
  #start-heading { font-family: "Oswald", Arial, sans-serif; font-weight: 700; font-size: 15px;
    color: #ececec; margin: 0 0 18px; text-align: center; }
  #opponent-options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .opponent-btn { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #e8b459; color: #1e1e24; border: 2px solid #b0956e; border-radius: 8px;
    padding: 14px 20px; cursor: pointer; font-family: "Oswald", Arial, sans-serif; width: 100%;
    box-shadow: 0 2px 2px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.35); }
  .opponent-btn:hover { background: #d9a34a; }
  .opponent-btn:active { box-shadow: inset 0 2px 3px rgba(0,0,0,0.35); }
  .opponent-btn-title { font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
  .opponent-swatches { display: flex; gap: 5px; flex-shrink: 0; }
  .opponent-swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.35); }
</style>
</head>
<body>
<div id="start-screen">
  <div id="start-screen-inner">
    <div id="start-title">Thunder Road Vendetta</div>
    <div id="start-subtitle">Prototype solo — contre l'IA</div>
    <div id="start-heading">Choisissez le nombre d'adversaires IA</div>
    <div id="opponent-options">
      <button class="opponent-btn" data-ai-count="1">
        <span class="opponent-btn-title">1 adversaire</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
        </span>
      </button>
      <button class="opponent-btn" data-ai-count="2">
        <span class="opponent-btn-title">2 adversaires</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
          <span class="opponent-swatch" style="background:#5a8f4a"></span>
        </span>
      </button>
      <button class="opponent-btn" data-ai-count="3">
        <span class="opponent-btn-title">3 adversaires</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
          <span class="opponent-swatch" style="background:#5a8f4a"></span>
          <span class="opponent-swatch" style="background:#7a5aa3"></span>
        </span>
      </button>
    </div>
  </div>
</div>
<div id="wrap">
  <div class="badges">
    <span class="badge" id="roundBadge"></span>
    <span class="badge" id="playerBadge"></span>
    <span class="badge" id="roadDieBadge"></span>
    <span class="badge" id="commandUsedBadge"></span>
    <span class="badge">Pool : <span id="dicePool"></span></span>
  </div>
  <svg id="board" viewBox="0 0 900 500"></svg>
  <svg id="dashboards" viewBox="0 0 900 300"></svg>
  <div id="panel"></div>
  <div class="damageList" id="damageRow"></div>
  <div id="winnerBanner"></div>
  <div id="log"></div>
  <div class="legend">Cercle jaune = voiture activée ce tour. Case surlignée = destination atteignable pour le choix en cours. Vous jouez « Vous » (bleu) contre « IA » (rouge).</div>
</div>
<script>
__ENGINE_BUNDLE__
</script>
<script>
__UI_SCRIPT__
</script>
</body>
</html>
