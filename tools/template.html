<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Retour de Mayrik (usage réel sur téléphone) : la balise viewport
     avec maximum-scale=1/user-scalable=no (essayée d'abord) NE
     FONCTIONNE PAS sur Safari iOS — ignorée depuis iOS 10 (confirmé,
     Apple a délibérément arrêté de la respecter). La méthode robuste,
     éprouvée et documentée (Microsoft, spec CSS touch-action,
     fonctionne sur iOS Safari 13+ ET Android) : touch-action:
     manipulation sur body (voir plus bas dans le CSS) — autorise
     normalement le défilement et le pincement-zoom, mais désactive
     SPÉCIFIQUEMENT le double-tap-zoom du navigateur, sans bloquer tout
     zoom comme le ferait user-scalable=no (accessibilité préservée).
     #dashboards-viewport garde son touch-action:none propre (Panzoom
     y prend le contrôle total), qui l'emporte localement sur ce
     réglage global. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunder Road Vendetta — Prototype jouable (humain vs IA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: -apple-system, sans-serif; background: #1e1e24; color: #eee; margin: 0; padding: 0; touch-action: manipulation; }
  #wrap { max-width: 1000px; margin: 0 auto; }
  .die { display: inline-block; background: #3a3a46; border-radius: 4px; padding: 2px 7px; margin-right: 3px; font-weight: bold; }
  .clickable { cursor: pointer; }
  .clickable:hover { filter: brightness(1.3); }
  /* Retirés de l'affichage (retour de Mayrik) — gardés dans le DOM
     (juste masqués) car ui-script.js continue d'y écrire du contenu ;
     les enlever du DOM casserait ces appels. */
  h1, .sub, .badges, #panel, .damageList, .legend { display: none; }
  #choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button.choice { background: #3a3a46; border: 1px solid #555; color: #eee; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.choice:hover { background: #4a4a58; }
  button.choice.selected { background: #ffb347; color: #1e1e24; font-weight: bold; }
  button.primary { background: #ffb347; border: none; color: #1e1e24; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin: 0; }
  button.primary:disabled { opacity: 0.3; cursor: default; }
  button.secondary { background: #555; border: none; color: #eee; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; margin-left: 8px; }
  #log { margin: 12px; padding: 12px; background: #2c2c36; border-radius: 8px; font-size: 13px; line-height: 1.6; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
  #log div.line { margin-bottom: 2px; }
  #log div.turn-sep { color: #ffb347; font-weight: bold; margin: 6px 0 2px 0; }
  #winnerBanner { display: none; }

  /* --------------------------------------------------------------
     Zone 1 — plateau de jeu (retour de Mayrik) : zoom FIXE, toujours
     calé pour qu'1 tuile de route remplisse la largeur de l'écran —
     jamais de pincement ici, juste un défilement horizontal natif
     (scroll natif du conteneur = zoom fixe + panoramique gratuits,
     avec l'inertie tactile native en prime). La largeur réelle du SVG
     est posée en JS (voir setupBoardScroll()) à un multiple de 100% du
     conteneur, calculé depuis BOARD_VIEW/largeur d'une tuile — jamais
     une valeur en dur, pour rester juste si la géométrie du plateau
     change un jour. Le curseur en dessous n'est qu'un INDICATEUR/
     raccourci de position par rapport au plateau assemblé complet
     (pas un zoom) — synchronisé dans les deux sens avec scrollLeft. */
  #board-viewport { width: 100%; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; background: #26262e;
    scrollbar-width: none; -ms-overflow-style: none; }
  #board-viewport::-webkit-scrollbar { display: none; }
  #board-viewport svg { display: block; height: auto; }
  #board-position-slider { width: 100%; display: block; margin: 6px 0 10px; accent-color: #ffb347; height: 18px; cursor: pointer; }

  /* --------------------------------------------------------------
     Zone 2 — bande d'info (retour de Mayrik) : hauteur fixe, pleine
     largeur, pas de zoom — juste une adaptation naturelle aux
     différentes largeurs d'écran. Structure posée maintenant ; le
     contenu (informations/explications de jeu) viendra étoffer ceci
     dans un chantier séparé. Style "afficheur de flipper" en attendant
     mieux : police monospace, espacement des lettres, léger halo —
     approximation raisonnable sans police bitmap dédiée. */
  /* Bouton plein écran (retour de Mayrik) : flottant et indépendant
     des 3 zones — jamais placé DANS #info-band, dont le contenu est
     entièrement réécrit à chaque tour (voir updateInfoBand), ce qui
     l'aurait fait disparaître aussitôt. Masqué proprement en JS si
     l'API Fullscreen n'est pas disponible (iOS Safari/Chrome ne la
     supportent pas du tout pour un élément quelconque — restriction
     délibérée d'Apple — plutôt que d'afficher un bouton qui ne ferait
     rien). */
  #fullscreen-btn { position: fixed; top: 8px; right: 8px; z-index: 2000;
    background: rgba(30,30,36,0.85); border: 1px solid #555; color: #eee; border-radius: 6px;
    padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #fullscreen-btn:hover { background: rgba(60,60,70,0.9); }

  #info-band { width: 100%; box-sizing: border-box; min-height: 44px; background: #0d0d10;
    border-top: 2px solid #3a3a46; border-bottom: 2px solid #3a3a46;
    display: flex; align-items: center; justify-content: center; padding: 6px 14px;
    font-family: "Courier New", monospace; font-weight: bold; font-size: 15px;
    letter-spacing: 2px; color: #ffb347; text-shadow: 0 0 6px rgba(255,179,71,0.55);
    text-align: center; }

  /* --------------------------------------------------------------
     Zone 3 — dashboards des joueurs (retour de Mayrik) : librement
     zoomable/déplaçable au pincement tactile ET à la souris, mais
     CONTENUE à cette seule zone (contrairement au pincement natif du
     téléphone, qui zoomait toute la page HTML avant ce correctif).
     Gérée par Panzoom (voir tools/panzoom.min.js, vendorisé — voir
     initDashboardsPanzoom() dans ui-script.js). touch-action:none
     laisse Panzoom gérer lui-même tous les gestes tactiles sans que le
     navigateur ne s'en mêle. La hauteur du conteneur est posée
     dynamiquement en JS pour toujours cadrer exactement l'ensemble des
     dashboards à l'échelle 1 (comme aujourd'hui) — le zoom du joueur
     s'applique PAR-DESSUS cette base. */
  /* Marge de secours (retour de Mayrik : sur téléphone, une fois le
     doigt posé dans la zone dashboards, impossible de redéfiler la
     page — touch-action:none capture tout geste qui y démarre). Cette
     marge reste en touch-action NORMAL (jamais capturée par Panzoom),
     offrant toujours une zone de repli pour attraper le défilement de
     la page — même principe que la marge verticale "gratuite" déjà
     présente sur ordinateur (bords de l'écran hors zone dashboards). */
  #dashboards-margin { width: 100%; height: 14px; background: #1e1e24; }
  #dashboards-viewport { width: 100%; overflow: hidden; position: relative; touch-action: none; background: #26262e; }
  #dashboards-viewport svg { display: block; width: 100%; height: auto; }
  /* 3 préréglages de zoom (retour de Mayrik) : carrés accolés en haut
     droit de la zone dashboards. touch-action:auto : ce sont des
     boutons normaux, jamais capturés par Panzoom (touch-action:none
     du conteneur parent). */
  #dashboards-zoom-presets { position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; touch-action: auto; }
  #dashboards-zoom-presets button { width: 32px; height: 32px; background: rgba(30,30,36,0.85);
    border: 1px solid #555; color: #eee; font-size: 12px; font-weight: bold; cursor: pointer; padding: 0; }
  #dashboards-zoom-presets button + button { border-left: none; }
  #dashboards-zoom-presets button:first-child { border-radius: 6px 0 0 6px; }
  #dashboards-zoom-presets button:last-child { border-radius: 0 6px 6px 0; }
  #dashboards-zoom-presets button:hover { background: rgba(60,60,70,0.9); }

  /* --------------------------------------------------------------
     Écran d'accueil (retour de Mayrik) : choix du nombre d'IA avant
     le début de la partie. Ambiance graphique reprise de TRV Road
     Tile Editor (même jeu, même univers) — fond parchemin, overlay
     sombre, typographie extrudée "Alfa Slab One"/Oswald, boutons dorés
     à bordure. Prototype pour l'instant (1/2/3 IA seulement) — un
     futur menu complet (2e joueur humain, options) viendra remplacer
     ceci sans toucher au reste de l'appli, même esprit que #title-band
     dans le projet de référence. Visible par défaut ; masqué une fois
     un choix fait (voir hideStartScreen() dans ui-script.js). -->
  #start-screen { position: fixed; inset: 0; background: #565558; display: flex;
    align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  #start-screen-inner { display: flex; flex-direction: column; align-items: center; max-width: 460px; width: 100%; }
  #start-title { font-family: "Alfa Slab One", serif; font-size: clamp(24px, 6vw, 34px);
    color: #ecd5a7; text-transform: uppercase; letter-spacing: 1px; text-align: center;
    -webkit-text-stroke: 1.2px #000; text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,0.6);
    margin: 0 0 4px; }
  #start-subtitle { font-family: "Oswald", Arial, sans-serif; font-weight: 700; font-size: 12px;
    color: #d9a34a; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 30px; text-align: center; }
  #start-heading { font-family: "Oswald", Arial, sans-serif; font-weight: 700; font-size: 15px;
    color: #ececec; margin: 0 0 18px; text-align: center; }
  #opponent-options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .opponent-btn { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #e8b459; color: #1e1e24; border: 2px solid #b0956e; border-radius: 8px;
    padding: 14px 20px; cursor: pointer; font-family: "Oswald", Arial, sans-serif; width: 100%;
    box-shadow: 0 2px 2px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.35); }
  .opponent-btn:hover { background: #d9a34a; }
  .opponent-btn:active { box-shadow: inset 0 2px 3px rgba(0,0,0,0.35); }
  .opponent-btn-title { font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
  .opponent-swatches { display: flex; gap: 5px; flex-shrink: 0; }
  .opponent-swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.35); }
</style>
</head>
<body>
<div id="start-screen">
  <div id="start-screen-inner">
    <div id="start-title">Thunder Road Vendetta</div>
    <div id="start-subtitle">Prototype solo — contre l'IA</div>
    <div id="start-heading">Choisissez le nombre d'adversaires IA</div>
    <div id="opponent-options">
      <button class="opponent-btn" data-ai-count="1">
        <span class="opponent-btn-title">1 adversaire</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
        </span>
      </button>
      <button class="opponent-btn" data-ai-count="2">
        <span class="opponent-btn-title">2 adversaires</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
          <span class="opponent-swatch" style="background:#5a8f4a"></span>
        </span>
      </button>
      <button class="opponent-btn" data-ai-count="3">
        <span class="opponent-btn-title">3 adversaires</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
          <span class="opponent-swatch" style="background:#5a8f4a"></span>
          <span class="opponent-swatch" style="background:#7a5aa3"></span>
        </span>
      </button>
    </div>
  </div>
</div>
<div id="wrap">
  <button id="fullscreen-btn" type="button" title="Plein écran">⛶ Plein écran</button>
  <div class="badges">
    <span class="badge" id="roundBadge"></span>
    <span class="badge" id="playerBadge"></span>
    <span class="badge" id="roadDieBadge"></span>
    <span class="badge" id="commandUsedBadge"></span>
    <span class="badge">Pool : <span id="dicePool"></span></span>
  </div>

  <!-- Zone 1 : plateau de jeu — zoom fixe (1 tuile = largeur écran),
       défilement horizontal natif, curseur de position en dessous. -->
  <div id="board-viewport">
    <svg id="board" viewBox="0 0 900 500"></svg>
  </div>
  <input type="range" id="board-position-slider" min="0" max="1000" value="0" aria-label="Position sur le plateau assemblé">

  <!-- Zone 2 : bande d'info (structure posée, contenu à venir). -->
  <div id="info-band"></div>

  <!-- Zone 3 : dashboards des joueurs — librement zoomables/déplaçables
       (Panzoom), contenus à cette seule zone. Marge de secours
       au-dessus/dessous (touch-action normal), pour toujours pouvoir
       redéfiler la page sur téléphone (retour de Mayrik). Le
       double-tap/double-clic (voir ui-script.js) bascule x1/x4 ; les 3
       boutons x1/x2/x4 (retour de Mayrik) donnent en plus un accès
       direct à chaque palier, en revenant systématiquement à l'angle
       haut gauche. -->
  <div id="dashboards-margin"></div>
  <div id="dashboards-viewport">
    <div id="dashboards-zoom-presets">
      <button type="button" data-zoom-preset="1">x1</button>
      <button type="button" data-zoom-preset="2">x2</button>
      <button type="button" data-zoom-preset="4">x4</button>
    </div>
    <svg id="dashboards" viewBox="0 0 900 300"></svg>
  </div>
  <div id="dashboards-margin"></div>

  <div id="panel"></div>
  <div class="damageList" id="damageRow"></div>
  <div id="winnerBanner"></div>
  <div id="log"></div>
  <div class="legend">Cercle jaune = voiture activée ce tour. Case surlignée = destination atteignable pour le choix en cours. Vous jouez « Vous » (bleu) contre « IA » (rouge).</div>
</div>
<script>
__ENGINE_BUNDLE__
</script>
<script>
__PANZOOM_BUNDLE__
</script>
<script>
__UI_SCRIPT__
</script>
</body>
</html>
