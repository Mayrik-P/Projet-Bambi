<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Retour de Mayrik (usage réel sur téléphone) : la balise viewport
     avec maximum-scale=1/user-scalable=no (essayée d'abord) NE
     FONCTIONNE PAS sur Safari iOS — ignorée depuis iOS 10 (confirmé,
     Apple a délibérément arrêté de la respecter). La méthode robuste,
     éprouvée et documentée (Microsoft, spec CSS touch-action,
     fonctionne sur iOS Safari 13+ ET Android) : touch-action:
     manipulation sur body (voir plus bas dans le CSS) — autorise
     normalement le défilement et le pincement-zoom, mais désactive
     SPÉCIFIQUEMENT le double-tap-zoom du navigateur, sans bloquer tout
     zoom comme le ferait user-scalable=no (accessibilité préservée).
     #dashboards-viewport garde son touch-action:none propre (Panzoom
     y prend le contrôle total), qui l'emporte localement sur ce
     réglage global.

     viewport-fit=cover (retour de Mayrik : bande noire inutilisée en
     haut de l'écran, même en plein écran) : sans lui, le navigateur
     confine par défaut la page à la "zone sûre" sous la barre système
     (comportement viewport-fit=auto implicite) — documenté par Chrome
     lui-même (developer.chrome.com/docs/css-ui/edge-to-edge). cover
     autorise le contenu à s'étendre jusqu'au bord réel de l'écran ;
     env(safe-area-inset-*) (voir plus bas dans le CSS) garde ensuite
     le contenu important hors de la zone d'encoche/barre système,
     pendant que le FOND, lui, s'étend bien jusqu'au bord. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thunder Road Vendetta — Prototype jouable (humain vs IA)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, sans-serif; background: #1e1e24; color: #eee; padding: 0; touch-action: manipulation; min-height: 100dvh; }
  /* Colonne flexible remplissant tout l'écran disponible (retour de
     Mayrik : caler chaque zone sans espace mort ni recouvrement) —
     100dvh (dynamic viewport height) plutôt que 100vh : sur mobile,
     100vh est peu fiable (la barre d'adresse du navigateur qui
     apparaît/disparaît fausse le calcul), dvh est l'unité moderne
     conçue justement pour ce cas, bien supportée aujourd'hui.
     padding-top/bottom: env(safe-area-inset-*) — garde le CONTENU hors
     de la zone d'encoche/barre système (voir la balise viewport plus
     haut, viewport-fit=cover) tout en laissant le FOND de body, lui,
     s'étendre jusqu'au bord réel de l'écran. box-sizing:border-box :
     ce padding est inclus dans les 100dvh, jamais ajouté par-dessus. */
  /* COQUILLE (refonte de la mise en page) : #wrap n'est plus une colonne
     flexible mais un simple repère de positionnement. Chaque module est
     placé en absolu aux coordonnées calculées par layout-engine.js
     (fonction pure, testée sur ~12 000 tailles d'écran) — voir
     applyLayout() dans ui-script.js.
     POURQUOI CE CHANGEMENT : en flexbox, quand la somme des hauteurs
     demandées dépassait l'espace réel — systématiquement en paysage et
     sur ordinateur — les conteneurs étaient rétrécis EN SILENCE par
     flex-shrink pendant que les SVG à l'intérieur gardaient leur taille,
     d'où le plateau tronqué (mesuré : 50 px obtenus pour 164 demandés en
     paysage, 190 pour 340 sur ordinateur). Désormais un seul calcul
     répartit toute la hauteur : plus personne ne réclame une place qui
     n'existe pas.
     max-width supprimé : c'était un réglage de confort de lecture, il
     gâchait 512 px sur un écran de 1512.
     height: 100dvh sert d'amorce avant le premier passage de JS, qui
     pose ensuite la hauteur réelle mesurée via visualViewport.
     Le padding safe-area reste : les coordonnées des modules sont
     relatives à la boîte de padding, donc naturellement à l'intérieur de
     la zone sûre. */
  #wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; margin: 0; display: block;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  /* Les modules sont positionnés par applyLayout() ; min-height:0 et
     overflow maîtrisé évitent qu'un contenu trop grand repousse sa
     propre boîte. */
  #board-viewport, #info-band, #dashboards-viewport, #round-module,
  #roaddie-module, #dicetrack-module, #board-position-slider {
    position: absolute; min-height: 0; box-sizing: border-box; }
  /* Module ROUND (retour de Mayrik) : indépendant de la bande d'info,
     dont le contenu est réécrit à chaque action. Contenu réduit à
     « ROUND X ». Se place soit dans la grille, soit en surimpression
     dans le coin haut-gauche du plateau quand la place manque. */
  #round-module { display: flex; align-items: center; justify-content: center;
    background: #0d0d10; border: 1px solid #3a3a46; border-radius: 4px;
    font-family: "Courier New", monospace; font-weight: bold; font-size: 13px;
    letter-spacing: 1px; color: #ffb347; text-shadow: 0 0 6px rgba(255,179,71,0.55);
    pointer-events: none; }
  #round-module.over-board { background: rgba(13,13,16,0.82); z-index: 5; }
  /* Module ROAD DIE : carré, la face remplit la boîte. */
  #roaddie-module { display: flex; align-items: center; justify-content: center;
    background: #0d0d10; border: 1px solid #3a3a46; border-radius: 6px;
    padding: 3px; pointer-events: none; }
  #roaddie-module.over-board { background: rgba(13,13,16,0.82); z-index: 5; }
  #roaddie-module img { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* Module DICETRACK : 1 ou 2 faces, côte à côte ou superposées selon
     la forme que la mise en page lui a donnée. */
  #dicetrack-module { display: flex; align-items: center; justify-content: center;
    gap: 6px; background: #0d0d10; border: 1px solid #3a3a46; border-radius: 6px;
    padding: 4px; pointer-events: none; }
  #dicetrack-module.vertical { flex-direction: column; }
  #dicetrack-module.over-board { background: rgba(13,13,16,0.82); z-index: 5; }
  #dicetrack-module img.dicetrack-face { height: 100%; width: auto; aspect-ratio: 1 / 1;
    object-fit: contain; display: block; }
  #dicetrack-module.vertical img.dicetrack-face { width: 100%; height: auto; }
  /* Le curseur de position fait partie du module plateau : il occupe sa
     propre bande sous la fenêtre de jeu, et passe en surimpression sur
     celle-ci quand la hauteur manque (premier échelon de dégradation,
     avant tout sacrifice de module). */
  #board-position-slider.over-board { z-index: 5; opacity: 0.85; }
  .die { display: inline-block; background: #3a3a46; border-radius: 4px; padding: 2px 7px; margin-right: 3px; font-weight: bold; }
  .clickable { cursor: pointer; }
  .clickable:hover { filter: brightness(1.3); }
  /* Retirés de l'affichage (retour de Mayrik) — gardés dans le DOM
     (juste masqués) car ui-script.js continue d'y écrire du contenu ;
     les enlever du DOM casserait ces appels. #log manquait à l'appel
     (oubli d'origine) : resté en display:flex, ses marges/padding
     (48px à vide) créaient l'espace mort en bas d'écran signalé par
     Mayrik, une fois la colonne flexible mise en place. */
  h1, .sub, .badges, #panel, .damageList, .legend { display: none; }
  #choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button.choice { background: #3a3a46; border: 1px solid #555; color: #eee; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.choice:hover { background: #4a4a58; }
  button.choice.selected { background: #ffb347; color: #1e1e24; font-weight: bold; }
  button.primary { background: #ffb347; border: none; color: #1e1e24; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin: 0; }
  button.primary:disabled { opacity: 0.3; cursor: default; }
  button.secondary { background: #555; border: none; color: #eee; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; margin-left: 8px; }
  #log { display: none; margin: 12px; padding: 12px; background: #2c2c36; border-radius: 8px; font-size: 13px; line-height: 1.6; max-height: 260px; overflow-y: auto; flex-direction: column-reverse; }
  #log div.line { margin-bottom: 2px; }
  #log div.turn-sep { color: #ffb347; font-weight: bold; margin: 6px 0 2px 0; }
  #winnerBanner { display: none; }

  /* --------------------------------------------------------------
     Zone 1 — plateau de jeu (retour de Mayrik) : zoom FIXE, toujours
     calé pour qu'1 tuile de route remplisse la largeur de l'écran —
     jamais de pincement ici, juste un défilement horizontal natif
     (scroll natif du conteneur = zoom fixe + panoramique gratuits,
     avec l'inertie tactile native en prime). La largeur réelle du SVG
     est posée en JS (voir setupBoardScroll()) à un multiple de 100% du
     conteneur, calculé depuis BOARD_VIEW/largeur d'une tuile — jamais
     une valeur en dur, pour rester juste si la géométrie du plateau
     change un jour. Le curseur en dessous n'est qu'un INDICATEUR/
     raccourci de position par rapport au plateau assemblé complet
     (pas un zoom) — synchronisé dans les deux sens avec scrollLeft. */
  #board-viewport { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; background: #26262e;
    scrollbar-width: none; -ms-overflow-style: none; }
  #board-viewport::-webkit-scrollbar { display: none; }
  #board-viewport svg { display: block; height: auto; }
  #board-position-slider { display: block; margin: 0; accent-color: #ffb347; height: 18px; cursor: pointer; }

  /* --------------------------------------------------------------
     Zone 2 — bande d'info (retour de Mayrik) : occupe maintenant TOUT
     l'espace restant entre le curseur du plateau et la zone dashboards
     (flex:1 dans la colonne flexible de #wrap), plus une hauteur fixe
     — c'est justement ce qui absorbe l'espace libre pour qu'il n'y ait
     plus jamais de zone vide où l'arrière-plan de l'écran serait
     visible. Toujours pas de zoom — juste une adaptation naturelle aux
     différentes hauteurs d'écran. Structure posée maintenant ; le
     contenu (informations/explications de jeu) viendra étoffer ceci
     dans un chantier séparé. Style "afficheur de flipper" en attendant
     mieux : police monospace, espacement des lettres, léger halo —
     approximation raisonnable sans police bitmap dédiée. */
  /* Bouton plein écran (retour de Mayrik) : flottant et indépendant
     des 3 zones — jamais placé DANS #info-band, dont le contenu est
     entièrement réécrit à chaque tour (voir updateInfoBand), ce qui
     l'aurait fait disparaître aussitôt. Masqué proprement en JS si
     l'API Fullscreen n'est pas disponible (iOS Safari/Chrome ne la
     supportent pas du tout pour un élément quelconque — restriction
     délibérée d'Apple — plutôt que d'afficher un bouton qui ne ferait
     rien). */
  #fullscreen-btn { position: fixed; top: 8px; right: 8px; z-index: 2000;
    background: rgba(30,30,36,0.85); border: 1px solid #555; color: #eee; border-radius: 6px;
    padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #fullscreen-btn:hover { background: rgba(60,60,70,0.9); }

  #info-band { background: #0d0d10;
    border-top: 2px solid #3a3a46; border-bottom: 2px solid #3a3a46;
    display: flex; align-items: center; justify-content: center; padding: 6px 14px;
    font-family: "Courier New", monospace; font-weight: bold; font-size: 15px;
    letter-spacing: 2px; color: #ffb347; text-shadow: 0 0 6px rgba(255,179,71,0.55);
    text-align: center; }

  /* --------------------------------------------------------------
     Zone 3 — dashboards des joueurs. Panzoom retiré : le déplacement
     est le DÉFILEMENT NATIF du navigateur et le zoom change la largeur
     du SVG (voir le long commentaire dans ui-script.js).
     touch-action: pan-x pan-y — le navigateur gère lui-même le
     déplacement à un doigt, avec son inertie ; le pincement à deux
     doigts est intercepté par nos gestionnaires d'événements pointeur.
     overscroll-behavior: contain — un geste qui atteint le bord de la
     zone ne déborde pas sur la page.
     -------------------------------------------------------------- */
  #dashboards-viewport { overflow: auto; overscroll-behavior: contain;
    touch-action: pan-x pan-y; background: #26262e;
    scroll-snap-type: y proximity; }
  /* Le rail répartit les rangées ; le zoom élargit les COLONNES, et la
     hauteur de chaque rangée suit son rapport d'aspect. La zone
     défilable grandit donc toute seule. */
  #dashboards-rail { display: grid; align-content: start; gap: var(--dash-gap, 6px);
    grid-template-columns: repeat(var(--dash-cols, 1),
      calc(var(--dash-col-w, 100%) * var(--dash-zoom, 1))); }
  #dashboards-rail svg.dash-row { display: block; width: 100%; height: auto;
    scroll-snap-align: start; }
  /* Sortis du conteneur défilant : à l'intérieur, ils défileraient avec
     le contenu. Posés sur le coin haut-droit de la zone par
     applyLayout(). */
  #dashboards-zoom-presets { position: absolute; z-index: 10; display: flex; touch-action: auto; }
  #dashboards-zoom-presets button.active { background: rgba(90,120,150,0.95); }
  #dashboards-zoom-presets button { width: 32px; height: 32px; background: rgba(30,30,36,0.85);
    border: 1px solid #555; color: #eee; font-size: 12px; font-weight: bold; cursor: pointer; padding: 0; }
  #dashboards-zoom-presets button + button { border-left: none; }
  #dashboards-zoom-presets button:first-child { border-radius: 0 0 0 6px; }
  #dashboards-zoom-presets button:last-child { border-radius: 0 0 6px 0; }
  #dashboards-zoom-presets button:hover { background: rgba(60,60,70,0.9); }

  /* --------------------------------------------------------------
     Écran d'accueil (retour de Mayrik) : choix du nombre d'IA avant
     le début de la partie. Ambiance graphique reprise de TRV Road
     Tile Editor (même jeu, même univers) — fond parchemin, overlay
     sombre, typographie extrudée "Alfa Slab One"/Oswald, boutons dorés
     à bordure. Prototype pour l'instant (1/2/3 IA seulement) — un
     futur menu complet (2e joueur humain, options) viendra remplacer
     ceci sans toucher au reste de l'appli, même esprit que #title-band
     dans le projet de référence. Visible par défaut ; masqué une fois
     un choix fait (voir hideStartScreen() dans ui-script.js). -->
  /* z-index explicite : depuis que #wrap est lui aussi en position fixe,
     l'ordre du DOM ne suffit plus à le maintenir au-dessus — sans ça,
     le plateau recouvre l'écran d'accueil et intercepte les clics
     (défaut attrapé au test navigateur, pas visible à la relecture). */
  #start-screen { position: fixed; inset: 0; z-index: 1500; background: #565558; display: flex;
    align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  #start-screen-inner { display: flex; flex-direction: column; align-items: center; max-width: 460px; width: 100%; }
  #start-title { font-family: "Alfa Slab One", serif; font-size: clamp(24px, 6vw, 34px);
    color: #ecd5a7; text-transform: uppercase; letter-spacing: 1px; text-align: center;
    -webkit-text-stroke: 1.2px #000; text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,0.6);
    margin: 0 0 4px; }
  #start-subtitle { font-family: "Oswald", Arial, sans-serif; font-weight: 700; font-size: 12px;
    color: #d9a34a; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 30px; text-align: center; }
  #start-heading { font-family: "Oswald", Arial, sans-serif; font-weight: 700; font-size: 15px;
    color: #ececec; margin: 0 0 18px; text-align: center; }
  #opponent-options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .opponent-btn { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #e8b459; color: #1e1e24; border: 2px solid #b0956e; border-radius: 8px;
    padding: 14px 20px; cursor: pointer; font-family: "Oswald", Arial, sans-serif; width: 100%;
    box-shadow: 0 2px 2px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.35); }
  .opponent-btn:hover { background: #d9a34a; }
  .opponent-btn:active { box-shadow: inset 0 2px 3px rgba(0,0,0,0.35); }
  .opponent-btn-title { font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
  .opponent-swatches { display: flex; gap: 5px; flex-shrink: 0; }
  .opponent-swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.35); }
</style>
</head>
<body>
<div id="start-screen">
  <div id="start-screen-inner">
    <div id="start-title">Thunder Road Vendetta</div>
    <div id="start-subtitle">Prototype solo — contre l'IA</div>
    <div id="start-heading">Choisissez le nombre d'adversaires IA</div>
    <div id="opponent-options">
      <button class="opponent-btn" data-ai-count="1">
        <span class="opponent-btn-title">1 adversaire</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
        </span>
      </button>
      <button class="opponent-btn" data-ai-count="2">
        <span class="opponent-btn-title">2 adversaires</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
          <span class="opponent-swatch" style="background:#5a8f4a"></span>
        </span>
      </button>
      <button class="opponent-btn" data-ai-count="3">
        <span class="opponent-btn-title">3 adversaires</span>
        <span class="opponent-swatches">
          <span class="opponent-swatch" style="background:#3d6ba3"></span>
          <span class="opponent-swatch" style="background:#d9762e"></span>
          <span class="opponent-swatch" style="background:#5a8f4a"></span>
          <span class="opponent-swatch" style="background:#7a5aa3"></span>
        </span>
      </button>
    </div>
  </div>
</div>
<div id="wrap">
  <button id="fullscreen-btn" type="button" title="Plein écran">⛶ Plein écran</button>
  <div class="badges">
    <span class="badge" id="roundBadge"></span>
    <span class="badge" id="playerBadge"></span>
    <span class="badge" id="roadDieBadge"></span>
    <span class="badge" id="commandUsedBadge"></span>
    <span class="badge">Pool : <span id="dicePool"></span></span>
  </div>

  <!-- Zone 1 : plateau de jeu — zoom fixe (1 tuile = largeur écran),
       défilement horizontal natif, curseur de position en dessous. -->
  <div id="board-viewport">
    <svg id="board" viewBox="0 0 900 500"></svg>
  </div>
  <input type="range" id="board-position-slider" min="0" max="1000" value="0" aria-label="Position sur le plateau assemblé">

  <!-- Zone 2 : bande d'info (structure posée, contenu à venir). -->
  <div id="info-band"></div>

  <!-- Module ROUND : indépendant de la bande d'info. -->
  <div id="round-module"></div>

  <!-- Module ROAD DIE : face active du dé de round, en grand et en
       permanence. Le petit dé du dashboard du premier joueur reste en
       place (il dit QUI commence) mais il est illisible au zoom x1. -->
  <div id="roaddie-module"><img id="roaddie-face" alt=""></div>

  <!-- Module DICETRACK : les dés spéciaux du dernier lancer (Slam,
       direction, cascade, tir), affichés en grand jusqu'au lancer
       suivant. Rempli par showDiceTrack(). -->
  <div id="dicetrack-module"></div>

  <!-- Zone 3 : dashboards des joueurs — librement zoomables/déplaçables
       (Panzoom), contenus à cette seule zone. Le double-tap/double-clic
       (voir ui-script.js) bascule x1/x4 ; les 3 boutons x1/x2/x4
       (retour de Mayrik) donnent en plus un accès direct à chaque
       palier. Position et taille posées par applyLayout(). -->
  <div id="dashboards-viewport">
    <!-- RAIL : un <svg class="dash-row"> par joueur, créés par
         renderDashboards(). Répartis en 1 ou 2 colonnes selon le profil
         d'écran ; les joueurs qui ne tiennent pas sont atteignables par
         défilement, avec accrochage. -->
    <div id="dashboards-rail"></div>
  </div>
  <!-- Les préréglages de zoom sont SORTIS du conteneur : celui-ci
       défile désormais nativement, et des boutons placés dedans
       défileraient avec le contenu. applyLayout() les pose sur son coin
       haut-droit. -->
  <div id="dashboards-zoom-presets">
    <button type="button" data-zoom-preset="1">x1</button>
    <button type="button" data-zoom-preset="2">x2</button>
    <button type="button" data-zoom-preset="4">x4</button>
  </div>

  <div id="panel"></div>
  <div class="damageList" id="damageRow"></div>
  <div id="winnerBanner"></div>
  <div id="log"></div>
  <div class="legend">Cercle jaune = voiture activée ce tour. Case surlignée = destination atteignable pour le choix en cours. Vous jouez « Vous » (bleu) contre « IA » (rouge).</div>
</div>
<script>
__ENGINE_BUNDLE__
</script>
<script>
__PANZOOM_BUNDLE__
</script>
<script>
__UI_SCRIPT__
</script>
</body>
</html>
